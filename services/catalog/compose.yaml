# Postgres for CI and the homeserver. NOT for daily development: on a laptop
# the Homebrew Postgres 17 install is already running and the default
# DATABASE_URL points straight at it, so a container would be a second copy of
# the same database with a different password.
#
#   docker compose -f services/catalog/compose.yaml up -d
#   DATABASE_URL=postgres://catalog:catalog@localhost:5432/self_learn \
#     npm run catalog -- migrate
#
# The image tag is pinned to the same major the Homebrew install runs, so a
# migration cannot pass here and fail there on a version difference.

name: self-learn-catalog

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog
      # Local and homeserver-behind-Tailscale only. Nothing here is reachable
      # from the internet, and the cloud database of the eventual move gets its
      # credentials from the host, not from this file.
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: self_learn
    ports:
      - "5432:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      # The migrator connects immediately, and an unhealthy start is a confusing
      # "connection refused" three layers up. `pg_isready` with the real user and
      # database catches a container that is up but not yet accepting queries.
      test: ["CMD-SHELL", "pg_isready -U catalog -d self_learn"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  catalog-data:
