name: Feature request
description: Suggest an idea for self-learn
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Please describe the learning workflow you are trying to improve, not just the widget you want.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve? What are you trying to study, track or automate?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like self-learn to behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you've tried?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project does this touch?
      options:
        - Roadmap UI (courses, modules, topics, progress)
        - Learning pipeline (the `learn` CLI in scripts/learn)
        - Knowledge base (concept notes, session logs, learner state)
        - /learn or /review skill (the learning plugin)
        - manimkc (narrated animation videos)
        - Docs / DX
        - Other
    validations:
      required: true
