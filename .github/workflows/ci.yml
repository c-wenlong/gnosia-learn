name: CI

# Every pull request aimed at the default branch, and by hand from the Actions
# tab. This workflow only checks the code; production deploys through Vercel's
# Git integration (docs/DEPLOYMENT.md).
#
# A push to main does not run it. Every change reaches main through a pull
# request that already ran this exact job, so the push run checked the same
# code a second time. On a private repository's free minutes that was about a
# third of all runs (2026-10-04: 12 of the last 40), most of them cancelled
# part-way by the next merge but billed for the minutes they used. What it
# would have caught is two pull requests that pass alone and break together;
# run it by hand (workflow_dispatch) on main when that is a worry.
on:
  pull_request:
    branches: [main, master]
    # A pull request that changes nothing a step reads does not need a
    # fifteen-minute run. Markdown is never compiled or linted; the design
    # folders skipped are pictures, captured research and the untracked
    # reference symlinks, while docs/design/kit stays covered because eslint
    # lints its scripts. A tools/ pointer bump is a gitlink the checkout
    # below never fetches (submodules are off), so it cannot move lint,
    # typecheck, test or build either. Everything else, including this file,
    # still runs the full gate.
    paths-ignore:
      - "**.md"
      - "docs/design/brand/**"
      - "docs/design/hifi/**"
      - "docs/design/lofi/**"
      - "docs/design/reference/**"
      - "docs/design/research/**"
      - "docs/design/self-learn-lofi.fig"
      - "tools/**"
      - ".claude/**"
      - ".agents/**"
      - ".gitignore"
      - ".vercelignore"
      - "codecov.yml"
      - "LICENSE"
  workflow_dispatch:

# Least privilege by default. Nothing here writes to the repository, so the
# GITHUB_TOKEN only needs to read code. Coverage is uploaded with an explicit
# repository token rather than OIDC, so no `id-token: write` is needed either.
# https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
permissions:
  contents: read

# Cancel a run as soon as a newer one supersedes it.
# The key is the pull request number when there is one, and the git ref
# otherwise. Keying on github.ref alone is weaker, because the ref is not the
# same across the events that can fire for a single pull request: a branch
# push is refs/heads/<branch> while the pull request run is refs/pull/<n>/merge.
# Two runs for the same change then land in different groups and both keep
# burning minutes. The pull request number is stable across all of them.
# github.workflow is in the key so this workflow never cancels a run of a
# different workflow that happens to share a ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    # Measured 2026-10-02: the test step alone took 8 to 11 minutes while the
    # flip-rehearsal suite failed fast, and about 13 once it ran (its 18 tests
    # copy, dump and restore databases for over two minutes). With the setup
    # and the build around it, fifteen minutes cut a passing run off before
    # its last files. Thirty leaves room for a cold npm cache and a slow
    # runner, and still stops a hung step long before GitHub's six hours.
    timeout-minutes: 30

    # The catalog schema is mostly constraints, and no fake enforces a foreign
    # key, so its tests run against a real Postgres. Without this service they
    # skip themselves with a reason and the run stays green while checking
    # nothing, which is fine on a laptop and not fine here.
    #
    # The tag matches compose.yaml and the Homebrew install developers use, so
    # a migration cannot pass in one place and fail in another on a version
    # difference. The credentials are the container's own and reach nothing.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: catalog
          POSTGRES_PASSWORD: catalog
          POSTGRES_DB: self_learn
        ports:
          - 5432:5432
        # Without a health check the job starts npm ci against a container that
        # is still initialising, and the test step fails with a connection error
        # that looks like a code problem.
        options: >-
          --health-cmd "pg_isready -U catalog -d self_learn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Every step sees it, but only the test step uses it. The schema tests
      # create and drop a scratch database per run against this server, so they
      # never depend on, or leave anything in, self_learn itself.
      DATABASE_URL: postgres://catalog:catalog@localhost:5432/self_learn

    steps:
      - name: Checkout
        # Submodules are deliberately NOT fetched. tools/manimkc renders
        # animation videos and tools/tldrawkc draws diagrams; neither is needed
        # to lint, typecheck, test or build the web app. manimkc is also
        # expensive: it carries a nested manim submodule that is large to
        # clone. (eslint.config.mjs ignores tools/** for both, so a checkout
        # would not pollute lint, but there is still no reason to pay for it.)
        uses: actions/checkout@v7
        with:
          # Two commits: on a pull request HEAD is GitHub's merge commit and
          # HEAD^1 the base it merges into, so the step below can list what
          # the pull request changed.
          fetch-depth: 2

      - name: Setup Node.js
        # 22 matches the engines floor in package.json, which in turn clears
        # Next 16's own floor of >=20.9.0. The npm cache is keyed on
        # package-lock.json, so it is reused until a dependency actually moves.
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # ci, not install: it installs exactly what the lockfile pins and fails
        # outright if package.json and package-lock.json have drifted apart,
        # instead of quietly resolving something newer.
        run: npm ci

      - name: Postgres 17 client tools
        # scripts/flip-rehearsal.mjs (and its tests) run createdb, pg_dump and
        # pg_restore against the service above. The runner image ships an
        # older client, and pg_dump refuses a server newer than itself, so the
        # client is installed at the server's major version from the
        # PostgreSQL apt repository. PG_BIN names it outright, rather than
        # leaving the choice to the version wrapper Debian puts on PATH.
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      # The four steps below are kept separate on purpose. Each one fails with
      # a different signal, so a red run says what kind of thing broke without
      # anyone opening the log: style, types, behaviour, or the build.

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Choose the test files
        id: scope
        # scripts/flip-rehearsal.mjs is the owner's flip-day and cut-over
        # procedure, and its suite is the slowest in the repository (133 s of
        # 664 s on 2026-10-04): it copies, dumps and restores whole databases.
        # A pull request runs it only when it changes the script, the lib/
        # modules it imports, a migration (the rehearsal applies them to a
        # copy), or the suite itself; npm test on a laptop and a manual run
        # (workflow_dispatch) still run it every time. A change to the catalog
        # CLI alone does not: those verbs have their own suites, and they
        # change in most pull requests.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] &&
             ! git diff --name-only HEAD^1 HEAD |
               grep -qE '^(scripts/flip-rehearsal\.mjs|scripts/lib/|services/catalog/drizzle/|services/catalog/test/flip-rehearsal\.test\.ts)'; then
            echo "args=--exclude services/catalog/test/flip-rehearsal.test.ts" >> "$GITHUB_OUTPUT"
            echo "The flip-rehearsal suite is skipped: nothing it covers changed."
          fi

      - name: Tests with coverage
        # test:coverage rather than test, so the suite runs once and produces
        # the lcov report in the same pass instead of being executed twice.
        # Coverage is scoped in vitest.config.ts to apps/web/src/lib,
        # apps/web/src/data and scripts/learn: the app's routes and components
        # are view code and are untested by design, so leaving them out keeps
        # the percentage honest.
        # The hard gate is the thresholds block in that same config, which
        # exits non-zero when coverage drops. The gate lives in the repo's own
        # tooling, not in Codecov, so it fails the same way on a laptop as it
        # does here.
        #
        # services/ and packages/ are outside that coverage scope on purpose:
        # the catalog tests need the Postgres service above, so their number
        # would move with the environment rather than with the code.
        #
        # --maxWorkers=2: a private repository gets a 2-CPU runner, and vitest
        # defaults to one worker fewer than the CPUs, so on CI every test file
        # ran one after another (2026-10-04: 664 s of file time in an 814 s
        # step). Four workers were tried first and were worse than they look:
        # the step fell to 614 s, but the summed file time tripled to 1963 s
        # and a studio test hit its 30 s timeout, because the work is CPU (the
        # Postgres container and each file's scratch database migrations share
        # the same two CPUs), not waiting. Two workers, one per CPU.
        run: npm run test:coverage -- --maxWorkers=2 ${{ steps.scope.outputs.args }}

      - name: Production build
        # Runs on pull requests too, not only on the default branch. Next 16
        # surfaces some type and route errors only when it actually builds, so
        # a green typecheck is not enough to say the app compiles.
        # Agent chat uses free providers at runtime; the build needs no keys.
        run: npm run build

      - name: Check for a Codecov token
        id: codecov
        # Secrets cannot be read directly in an `if:` expression, and a step's
        # own `env:` block is NOT in scope for that same step's `if:` (it is
        # evaluated after the condition). So the presence of the token is
        # turned into a step output here and the upload below keys off that.
        # A job-level `env:` would also work, but it would hand the secret to
        # every step in the job, including `npm ci` and any install scripts it
        # runs. This keeps the secret inside one step that runs no third-party
        # code.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CODECOV_TOKEN is not set. Skipping the coverage upload."
          fi

      - name: Upload coverage to Codecov
        # Coverage reporting is a nice-to-have. Codecov being unreachable, or
        # the token not being configured yet, must not mark a run red when
        # every test passed. Two things keep that true: the condition skips the
        # step entirely while the secret is absent, and fail_ci_if_error covers
        # the case where the token is set but the upload fails anyway.
        if: steps.codecov.outputs.configured == 'true'
        # Pinned to a commit, not a tag, because this is the one third-party
        # action in the job and it is handed a repository secret. A tag can be
        # repointed by whoever controls the upstream repo; a SHA cannot. The
        # first-party actions above stay on their major tag: GitHub owns them
        # and they see no secret. Dependabot (github-actions ecosystem) keeps
        # this SHA current and rewrites the version comment alongside it.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
