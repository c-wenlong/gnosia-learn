name: Deploy

# Production deploys when a GitHub release is published, and only then.
# Vercel's Git integration builds nothing: apps/web/vercel.json sets
# git.deploymentEnabled to false, so neither a pull request (preview) nor a
# merge to main starts a deployment. Before that, every PR and every merge
# built one, and on the free plan's 100 deployments a day the busy days ran
# out (2026-10-04: "api-deployments-free-per-day" on every PR).
#
# To ship: gh release create v<x.y.z> --generate-notes
# workflow_dispatch redeploys whatever ref it is run on, for a rollback or a
# retry without cutting a new release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Two releases in quick succession deploy in order; the second never cancels
# the first half-way through promoting.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Identifiers, not secrets: the same values `vercel link` writes to
      # .vercel/project.json. The token is the only secret.
      VERCEL_ORG_ID: team_3RwDblsQVK0MHQPOndO1vDl8
      VERCEL_PROJECT_ID: prj_KfVuvAc4rWmQRe4NiSVgeEm5etXD
    steps:
      - name: Checkout
        # The release's tag (GITHUB_REF on a release event). Submodules are not
        # needed: the app imports nothing under tools/.
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy
        # The build runs on Vercel, not here, with the project's Production
        # environment variables and its Root Directory (apps/web), so it is
        # the same build the Git integration used to start. Run from the
        # repository root so the upload carries the workspace packages the
        # app imports. The CLI is pinned to an exact version because it is
        # handed the token.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Create one at https://vercel.com/account/tokens and run: gh secret set VERCEL_TOKEN"
            exit 1
          fi
          npx --yes vercel@62.2.0 deploy --prod --yes --token "$VERCEL_TOKEN"
