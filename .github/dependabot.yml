# Dependabot configuration.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Two ecosystems. `npm` watches package.json and package-lock.json: this is a
# deployed Next.js app, so a lockfile bump is a real deploy and wants a real
# pull request. `github-actions` watches .github/workflows/.
#
# Development dependencies are grouped into one pull request. A tooling bump
# (eslint, vitest, typescript, types) is verified by the same CI run whether
# it arrives alone or with five others, so one PR a week beats five.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      # react and react-dom pin each other to the exact same version, and the
      # @types packages track them. Bumping any one alone fails npm ci with
      # ERESOLVE, so they always travel as one pull request.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # vitest and @vitest/coverage-v8 require each other at the exact same
      # version, so a major of either on its own can never install. This
      # group has no update-types limit: it takes majors too, together.
      # Groups match in order, so it sits above the wildcard below.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Minor and patch only. A major bump of a tool (eslint, vitest, a
      # @types package jumping several Node versions) can need code or config
      # changes and deserves its own pull request, where it can fail or pass on
      # its own. @vitest/coverage-v8 in particular requires an exact vitest
      # version match, so a major of one without the other can never install.
      development-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      prefix-development: "chore"

  - package-ecosystem: "github-actions"
    # "/" means .github/workflows/, not the repository root.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # One pull request for all action bumps rather than one per action.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
