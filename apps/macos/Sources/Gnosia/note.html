<!doctype html>
<!--
  The note body's renderer. The whole markdown parse lives here now: the
  block parser and the inline parser are a port of the web app's own
  parser, packages/tutor/src/markdown.ts, so a note reads the same here as
  on /learn — headings, paragraphs, fenced code with its info label,
  thematic rules, nested lists, blockquotes and [!kind] callouts, GFM
  tables, display maths, wikilinks, embeds, links, emphasis, and the
  $…$ / $$…$$ maths typeset with the bundled KaTeX (the same renderer the
  web app runs on this content, lib/math.ts options included). On top of
  that parser's set this page also knows GFM pipe tables, ~~strikethrough~~
  and <https://…> autolinks, which the corpus uses and which fall out of
  the same recursive-descent shape.

  The contract with Swift is one call: gnosia({theme, source, stripTitle,
  embeds}) — theme is the G palette as CSS vars, source is the note's
  markdown (frontmatter already stripped by the index, stripped again here
  the way the web parser does), stripTitle drops a leading H1 that
  restates the page's title, and embeds maps each ![[name]] the caller
  could resolve to a data URI (a `diagram:learn/assets/<name>` row's blob,
  the web's embedAssetId rule). The page reports its laid-out height after
  every change so the Swift side can size the frame; it never scrolls.
  Links post {nav: url} back; wikilinks stay muted text — resolving them
  is native routing work, not renderer work.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root {
    --fg: #15283a; --muted: #605b54; --faint: #878276;
    --border: #e6dfd0; --codebg: #f3eee1; --accent: #0f5f61;
    --ok: #008024; --warn: #8c6800; --violet: #8b5cf6;
    --danger: #c43939; --sel: rgba(20, 130, 133, .25);
    /* The diagram mat stays light in both themes — the web's
       --diagram-matte, a constant on purpose (a tldrawkc export bakes its
       colours in for a light ground). */
    --matte: #f7f6f3;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  body {
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--fg);
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-weight: 700; line-height: 1.3; color: var(--fg); }
  h1 { font-size: 20px; margin: 1.2em 0 .4em; }
  h2 { font-size: 16px; margin: 1.25em 0 .4em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
  h3, h4 { font-size: 14px; margin: 1.2em 0 .35em; }
  h4 { color: var(--muted); }
  h1:first-child, h2:first-child, h3:first-child, h4:first-child, p:first-child,
  ul:first-child, ol:first-child, blockquote:first-child, aside.callout:first-child,
  div.cb:first-child, div.tw:first-child, figure:first-child { margin-top: 0; }
  p { margin: .35em 0 .8em; }
  p.empty { color: var(--muted); font-size: .93em; }
  ul, ol { margin: .3em 0 .8em; padding-left: 1.5em; }
  li { margin: .18em 0; }
  li > ul, li > ol { margin: .12em 0; }
  li > p { margin: .15em 0; }
  /* Nested containers sit tight against their parent's last line — the
     web's halved "tight" spacing inside items, quotes and callouts. */
  li > :last-child, blockquote > :last-child, aside.callout .cbody > :last-child { margin-bottom: 0; }
  pre {
    background: var(--codebg); border: 1px solid var(--border);
    border-radius: 7px; padding: 9px 11px; margin: .4em 0 .9em;
    font: 12px/1.55 ui-monospace, Menlo, monospace;
    overflow-x: auto; white-space: pre;
  }
  code { font: .88em ui-monospace, Menlo, monospace; background: var(--codebg); border-radius: 4px; padding: .08em .3em; }
  pre code { background: none; padding: 0; }
  /* A fenced block framed like the web's: the info word sits in a labelled
     bar when the fence wrote one (```check is a quiz card, not a sample). */
  div.cb {
    background: var(--codebg); border: 1px solid var(--border);
    border-radius: 7px; margin: .4em 0 .9em; overflow: hidden;
  }
  div.cb pre { margin: 0; border: 0; border-radius: 0; background: none; }
  p.cbinfo {
    margin: 0; padding: 3px 11px; border-bottom: 1px solid var(--border);
    font: 11px/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
  }
  hr { border: none; border-top: 1px solid var(--border); margin: 1.1em 0; }
  a { color: var(--accent); }
  /* A quote is a hairline and muted ink; a callout is a full rounded border
     in its tone at 32%, an 8% wash of it, and the title in the tone mixed
     into the ink — the web's three mixes, kept. */
  blockquote {
    margin: .4em 0 .9em; padding: 0 0 0 .9em;
    border-left: 1px solid var(--border); color: var(--muted);
  }
  blockquote blockquote { margin: .2em 0; }
  aside.callout {
    margin: .4em 0 .9em; padding: 8px 13px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--tone) 32%, var(--border));
    background: color-mix(in srgb, var(--tone) 8%, transparent);
  }
  aside.callout > p.ctitle {
    margin: 0 0 4px; font-size: 12.5px; font-weight: 600;
    color: color-mix(in srgb, var(--tone) 55%, var(--fg));
  }
  /* GFM tables: a hairline under the header and between rows, cell padding
     from the web's, and a horizontal scroll box so a wide table never
     stretches the frame. */
  div.tw { overflow-x: auto; margin: .5em 0 .9em; }
  table { border-collapse: collapse; font-size: .93em; }
  thead tr { border-bottom: 1.5px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: 0; }
  th, td { padding: 4px 10px; text-align: left; vertical-align: top; }
  th { font-weight: 600; }
  /* A picture framed like the web's Figure: a bordered card, the drawing on
     the constant mat (SVG) or the panel colour (raster), the caption under
     a hairline. */
  figure { margin: .5em 0 1em; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  figure .mat  { background: var(--matte);  padding: 10px; }
  figure .rmat { background: var(--codebg); padding: 10px; }
  figure img { display: block; max-width: 100%; max-height: 60vh; margin: 0 auto; }
  figcaption { border-top: 1px solid var(--border); padding: 6px 10px; font-size: .8em; color: var(--muted); }
  /* The named gap when an embed resolves to nothing — the web's dashed
     "not available on this page" paragraph. */
  p.gap {
    border: 1px dashed var(--border); border-radius: 7px;
    padding: 7px 11px; font-size: .8em; color: var(--muted);
  }
  p.gap span.mono, span.embed { font-family: ui-monospace, Menlo, monospace; }
  .wl, .embed { color: var(--muted); }
  .embed { border: 1px dashed var(--border); border-radius: 5px; padding: 0 .4em; font-size: .86em; }
  .wl { text-decoration: underline dotted; text-underline-offset: 2px; }
  del { text-decoration-thickness: 1px; }
  .katex { font-size: 1.05em; }
  .katex-display { margin: .55em 0 .95em; overflow-x: auto; overflow-y: hidden; padding: .1em 0; }
  .merr { color: var(--danger); font: .88em ui-monospace, Menlo, monospace; }
  ::selection { background: var(--sel); }
</style>
<body id="root"></body>
<script src="katex/katex.min.js"></script>
<script src="mdcore.js"></script>
<script>
"use strict";

const root = document.getElementById("root");

/* ==================================================================
   The host contract: gnosia(payload) in, {ready} / {h} / {nav} out.
   ================================================================== */

let lastH = -1;
function postHeight() {
  const h = Math.ceil(root.getBoundingClientRect().height);
  if (h !== lastH) { lastH = h; window.webkit.messageHandlers.gnosia.postMessage({ h: h }); }
}

function render(source, stripTitle, embeds) {
  const blocks = parseBlocks(splitFrontmatter(source));
  /* A leading H1 that restates the page's own title goes — the workspace
     and the asset pane already print it (stripTitle's whole job). */
  if (stripTitle && blocks.length > 0 && blocks[0].kind === "heading" && blocks[0].level === 1 &&
      blocks[0].text.trim().toLowerCase() === String(stripTitle).trim().toLowerCase()) {
    blocks.shift();
  }
  const ctx = { embeds: embeds || {} };
  root.innerHTML = blocks.length === 0
    ? '<p class="empty">This note has no body yet, only the metadata at the top of the file.</p>'
    : renderBlocks(blocks, ctx);
  requestAnimationFrame(postHeight);
}

function theme(vars) {
  for (const k in vars) document.documentElement.style.setProperty("--" + k, vars[k]);
  requestAnimationFrame(postHeight);
}

/* One call from Swift carries both, so a theme flip and a new document can
   never land half-applied. */
function gnosia(payload) {
  theme(payload.theme || {});
  render(payload.source || "", payload.stripTitle || null, payload.embeds || {});
}

new ResizeObserver(postHeight).observe(root);
document.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (a) { e.preventDefault(); window.webkit.messageHandlers.gnosia.postMessage({ nav: a.getAttribute("href") }); }
});
document.addEventListener("DOMContentLoaded", () =>
  window.webkit.messageHandlers.gnosia.postMessage({ ready: true }));
</script>
</html>
