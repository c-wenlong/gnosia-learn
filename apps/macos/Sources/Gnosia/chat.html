<!doctype html>
<!--
  One chat bubble's renderer, note.html's smaller sibling. Two render
  modes, matching the web's chat surfaces (TutorChat, OpenTutorChat,
  AskPanel): assistant turns arrive as raw markdown in "md" mode and run
  the same mdcore.js parser + renderer the note page runs — the web's
  TutorMessage is NoteProse, so a tutor reply reads exactly like the note.
  User turns arrive in "math" mode, the web's MathText inside UserMessage:
  maths typeset, everything else literal, newlines kept.

  The bubble itself is drawn here — fill, border width, radius, padding
  and font size arrive per-turn as CSS vars — so the height the page
  reports is the bubble the caller shows. Compact by chat standards:
  paragraphs and lists take a fraction of the note's air, and a
  max-height caps a runaway reply instead of growing the frame forever.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex/katex.min.css">
<style>
  :root {
    --fg: #15283a; --muted: #605b54; --faint: #878276;
    --border: #e6dfd0; --codebg: #f3eee1; --accent: #0f5f61;
    --ok: #008024; --warn: #8c6800; --violet: #8b5cf6;
    --danger: #c43939; --sel: rgba(20, 130, 133, .25);
    --matte: #f7f6f3;
    --bg: #fffdf8; --stroke: #e6dfd0; --line: 1px; --radius: 14px;
    --pad-x: 14px; --pad-y: 10px; --fs: 13px; --max-h: 900px;
  }
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  body {
    font: var(--fs)/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    color: var(--fg);
  }
  .bubble {
    background: var(--bg);
    border: var(--line) solid var(--stroke);
    border-radius: var(--radius);
    padding: var(--pad-y) var(--pad-x);
    max-height: var(--max-h);
    overflow-y: auto;
    overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased;
  }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  /* The user turn's plain run: literal text, newlines kept — the web's
     whitespace-pre-wrap on UserMessage. */
  .plain { margin: 0; white-space: pre-wrap; }
  h1, h2, h3, h4 { font-weight: 700; line-height: 1.3; color: var(--fg); }
  h1 { font-size: 1.25em; margin: .8em 0 .3em; }
  h2 { font-size: 1.12em; margin: .85em 0 .3em; }
  h3, h4 { font-size: 1em; margin: .8em 0 .25em; }
  h4 { color: var(--muted); }
  h1:first-child, h2:first-child, h3:first-child, h4:first-child, p:first-child,
  ul:first-child, ol:first-child, blockquote:first-child, aside.callout:first-child,
  div.cb:first-child, div.tw:first-child, figure:first-child { margin-top: 0; }
  p { margin: .3em 0 .55em; }
  p.empty { color: var(--muted); font-size: .93em; }
  ul, ol { margin: .25em 0 .55em; padding-left: 1.3em; }
  li { margin: .15em 0; }
  li > ul, li > ol { margin: .1em 0; }
  li > p { margin: .12em 0; }
  li > :last-child, blockquote > :last-child, aside.callout .cbody > :last-child { margin-bottom: 0; }
  pre {
    background: var(--codebg); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 9px; margin: .3em 0 .6em;
    font: 11.5px/1.5 ui-monospace, Menlo, monospace;
    overflow-x: auto; white-space: pre;
  }
  code { font: .88em ui-monospace, Menlo, monospace; background: var(--codebg); border-radius: 4px; padding: .08em .3em; }
  pre code { background: none; padding: 0; }
  div.cb {
    background: var(--codebg); border: 1px solid var(--border);
    border-radius: 6px; margin: .3em 0 .6em; overflow: hidden;
  }
  div.cb pre { margin: 0; border: 0; border-radius: 0; background: none; }
  p.cbinfo {
    margin: 0; padding: 3px 9px; border-bottom: 1px solid var(--border);
    font: 10.5px/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
  }
  hr { border: none; border-top: 1px solid var(--border); margin: .8em 0; }
  a { color: var(--accent); }
  blockquote {
    margin: .3em 0 .6em; padding: 0 0 0 .8em;
    border-left: 1px solid var(--border); color: var(--muted);
  }
  blockquote blockquote { margin: .15em 0; }
  aside.callout {
    margin: .3em 0 .6em; padding: 6px 11px; border-radius: 8px;
    border: 1px solid color-mix(in srgb, var(--tone) 32%, var(--border));
    background: color-mix(in srgb, var(--tone) 8%, transparent);
  }
  aside.callout > p.ctitle {
    margin: 0 0 3px; font-size: .92em; font-weight: 600;
    color: color-mix(in srgb, var(--tone) 55%, var(--fg));
  }
  div.tw { overflow-x: auto; margin: .35em 0 .6em; }
  table { border-collapse: collapse; font-size: .92em; }
  thead tr { border-bottom: 1.5px solid var(--border); }
  tbody tr { border-bottom: 1px solid var(--border); }
  tbody tr:last-child { border-bottom: 0; }
  th, td { padding: 3px 8px; text-align: left; vertical-align: top; }
  th { font-weight: 600; }
  figure { margin: .35em 0 .7em; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  figure .mat  { background: var(--matte);  padding: 8px; }
  figure .rmat { background: var(--codebg); padding: 8px; }
  figure img { display: block; max-width: 100%; max-height: 40vh; margin: 0 auto; }
  figcaption { border-top: 1px solid var(--border); padding: 5px 9px; font-size: .8em; color: var(--muted); }
  p.gap {
    border: 1px dashed var(--border); border-radius: 6px;
    padding: 6px 9px; font-size: .8em; color: var(--muted);
  }
  p.gap span.mono, span.embed { font-family: ui-monospace, Menlo, monospace; }
  .wl, .embed { color: var(--muted); }
  .embed { border: 1px dashed var(--border); border-radius: 5px; padding: 0 .4em; font-size: .86em; }
  .wl { text-decoration: underline dotted; text-underline-offset: 2px; }
  del { text-decoration-thickness: 1px; }
  .katex { font-size: 1.05em; }
  .katex-display { margin: .4em 0 .6em; overflow-x: auto; overflow-y: hidden; padding: .1em 0; }
  .merr { color: var(--danger); font: .88em ui-monospace, Menlo, monospace; }
  ::selection { background: var(--sel); }
</style>
<body><div id="root" class="bubble"></div></body>
<script src="katex/katex.min.js"></script>
<script src="mdcore.js"></script>
<script>
"use strict";

const root = document.getElementById("root");
const shell = window.webkit && window.webkit.messageHandlers
  && window.webkit.messageHandlers.gnosia;
function post(msg) { if (shell) shell.postMessage(msg); }

let lastH = -1;
function postHeight() {
  const h = Math.ceil(root.getBoundingClientRect().height);
  if (h !== lastH) { lastH = h; post({ h: h }); }
}

/* md mode: the note's own pipeline — the web's TutorMessage is NoteProse,
   so an assistant turn parses and renders exactly like the note body. */
function renderMd(source) {
  const blocks = parseBlocks(splitFrontmatter(source));
  root.innerHTML = renderBlocks(blocks, { embeds: {} });
  requestAnimationFrame(postHeight);
}

/* math mode: the web's MathText inside UserMessage — literal prose with
   its maths typeset, newlines kept, no markdown. */
function renderMaths(text) {
  let out = "", prose = "", i = 0;
  const emit = () => { out += esc(prose); prose = ""; };
  while (i < text.length) {
    if (text[i] === "\\" && text[i + 1] === "$") { prose += "$"; i += 2; continue; }
    const m = mathSpanAt(text.slice(i));
    if (m) { emit(); out += math(m.source, m.display); i += m.length; continue; }
    prose += text[i]; i += 1;
  }
  emit();
  root.innerHTML = '<div class="plain">' + out + "</div>";
  requestAnimationFrame(postHeight);
}

function theme(vars) {
  for (const k in vars) document.documentElement.style.setProperty("--" + k, vars[k]);
  requestAnimationFrame(postHeight);
}

/* One call from Swift carries theme + mode + content, so a theme flip
   and a new turn can never land half-applied. */
function gnosia(payload) {
  theme(payload.theme);
  if (payload.mode === "math") renderMaths(payload.text || "");
  else renderMd(payload.source || "");
}

new ResizeObserver(postHeight).observe(root);
document.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (a) { e.preventDefault(); post({ nav: a.getAttribute("href") }); }
});
document.addEventListener("DOMContentLoaded", () => post({ ready: true }));
</script>
</html>
