    maps:
      manimkc: [cortex/toolbox-permissions]
      courses: []
      concepts: []

  # ---------------- macos ----------------
  - slug: macos-power-management
    title: macOS power management
    domain: macos
    summary: What sleeps a Mac and what stops it is a ladder of power states guarded by IOKit assertions, which is why caffeinate and pmset disablesleep are not interchangeable.
