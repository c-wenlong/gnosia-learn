# Shared topic vocabulary for the self-learn catalog.
# One entry per topic. slug is permanent; everything else can change.
# maps.manimkc entries are manimkc/topics/<path> with the topics/ prefix dropped.
# maps.courses entries are course *module* ids (e.g. cp4284-m3), not topic-level -tN ids.
# maps.concepts entries are learn/concepts/<domain>/<file>.md ids (the frontmatter `id`).

topics:
  # ---------------- computer-architecture ----------------
  - slug: pipeline-hazards-and-forwarding
    title: Pipeline hazards and operand forwarding
    domain: computer-architecture
    summary: A data hazard in a pipeline stalls unless the result is forwarded straight from where it is produced to where it is needed.
    aliases: [operand bypassing, data forwarding, load-use hazard]
    maps:
      manimkc: [computer-architecture/instruction-level-parallelism/data-forwarding]
      courses: []
      concepts: []

  - slug: multi-issue-superscalar-pipelines
    title: Multi-issue and superscalar pipelines
    domain: computer-architecture
    summary: Issuing more than one instruction per cycle raises peak throughput but multiplies the hazards a pipeline has to handle.
    aliases: [superscalar, multiple issue, ILP limits]
    maps:
      manimkc: [computer-architecture/instruction-level-parallelism/multi-issue]
      courses: []
      concepts: []

  - slug: tomasulo-algorithm
    title: Tomasulo's algorithm
    domain: computer-architecture
    summary: Reservation stations and a common data bus let instructions execute out of order while still respecting true dependencies.
    aliases: [tomasulo, reservation stations, common data bus]
    maps:
      manimkc: [computer-architecture/instruction-level-parallelism/tomasulo]
      courses: []
      concepts: []

  - slug: register-renaming
    title: Register renaming
    domain: computer-architecture
    summary: Giving each write a fresh physical register removes the false WAR/WAW dependencies that architectural register names impose.
    aliases: [false dependencies, WAR WAW hazards, physical registers]
    maps:
      manimkc: [computer-architecture/instruction-level-parallelism/register-renaming]
      courses: []
      concepts: []

  - slug: reorder-buffer
    title: Reorder buffer
    domain: computer-architecture
    summary: The reorder buffer lets instructions finish out of order internally while committing their results in program order.
    aliases: [ROB, precise state, in-order commit]
    maps:
      manimkc: [computer-architecture/instruction-level-parallelism/reorder-buffer]
      courses: []
      concepts: []

  - slug: memory-dependencies
    title: Memory dependencies and load-store ordering
    domain: computer-architecture
    summary: A load's address is not known until it executes, so an out-of-order machine needs an explicit way to check it against pending stores.
    aliases: [load-store unit, memory aliasing, store-to-load forwarding]
    maps:
      manimkc: [computer-architecture/instruction-level-parallelism/memory-dependencies]
      courses: []
      concepts: []

  - slug: superscalar-design-space-exploration
    title: Superscalar design-space exploration
    domain: computer-architecture
    summary: Picking a superscalar core's width, functional units and cache split is a search over an area and power budget, not one formula.
    aliases: [design space exploration, IPC per watt, SimpleScalar]
    maps:
      manimkc: [computer-architecture/instruction-level-parallelism/design-space-exploration]
      courses: []
      concepts: []

  - slug: instruction-level-parallelism-overview
    title: Instruction-level parallelism, overview and revision
    domain: computer-architecture
    summary: A condensed tour of the whole ILP story, from the performance equation and hazards through Tomasulo, renaming, the ROB and memory dependencies.
    aliases: [ILP revision, CS4223 quiz map]
    maps:
      manimkc: [computer-architecture/instruction-level-parallelism/lecture-short, computer-architecture/instruction-level-parallelism/quiz1-revision-map]
      courses: []
      concepts: []

  # ---------------- algorithms ----------------
  - slug: asymptotic-notation-and-growth-rates
    title: Asymptotic notation and growth rates
    domain: algorithms
    summary: Big-O, big-Omega, Theta, little-o and little-omega are witness-based bounds on how a function grows, and the standard growth-rate hierarchy compares them by limit.
    aliases: [big-O, big-Omega, Theta notation, little-o, growth rate hierarchy]
    maps:
      manimkc: []
      courses: []
      concepts: [big-o-witness-definition, big-omega-witness-definition, little-o-and-little-omega, theta-as-both-bounds, comparing-growth-rates, logarithm-base-is-a-constant-factor]

  - slug: asymptotic-analysis-fundamentals
    title: Asymptotic analysis fundamentals
    domain: algorithms
    summary: Running time is counted against a cost model and input size, split by case (worst, best, average), and its abstraction hides real constants that sometimes matter.
    aliases: [cost model, worst case best case, running time analysis]
    maps:
      manimkc: []
      courses: []
      concepts: [machine-model-and-input-size, case-analysis-worst-best-average, average-case-needs-a-distribution, counting-operations-with-summations, asymptotic-abstraction-and-when-it-lies, problem-vs-algorithm-bounds, asymptotic-running-time-analysis]

  - slug: recurrence-relations
    title: Recurrence relations for recursive algorithms
    domain: algorithms
    summary: A recursive algorithm's running time is a recurrence, solved by expanding a tree, guessing and proving a closed form, or invoking the Master Theorem where it applies.
    aliases: [master theorem, recursion tree, substitution method]
    maps:
      manimkc: [algorithms/cs3230-assignment-1]
      courses: []
      concepts: [recurrence-for-recursive-running-time, recursion-tree-method, substitution-method, master-theorem, master-theorem-limits]

  - slug: amortised-analysis
    title: Amortised analysis
    domain: algorithms
    summary: Amortised cost bounds the worst-case total over a whole sequence of operations, proved by the aggregate, accounting, or potential method.
    aliases: [aggregate method, accounting method, potential method]
    maps:
      manimkc: []
      courses: []
      concepts: [amortised-cost-and-aggregate-method, accounting-method, potential-method]

  # ---------------- networking ----------------
  - slug: self-hosted-dns-filtering
    title: Self-hosted DNS filtering
    domain: networking
    summary: Running your own resolver (AdGuard Home) so every device's DNS queries are answered, filtered and logged on your network instead of upstream.
    aliases: [adguard home, dns sinkhole, pi-hole, dns rewrites]
    maps:
      manimkc: [networking/adguard-home]
      courses: []
      concepts: []

  - slug: tailscale-vpn-tunnels
    title: Tailscale and WireGuard tunnels
    domain: networking
    summary: Tailscale builds a private mesh network over WireGuard, negotiating direct peer-to-peer connections and falling back to relays when it can't.
    aliases: [wireguard, mesh vpn, ssh over tailscale]
    maps:
      manimkc: [networking/tailscale/ssh-tunnels]
      courses: []
      concepts: []

  - slug: wifi-network-diagnostics
    title: Wi-Fi network diagnostics
    domain: networking
    summary: Diagnosing a flaky Wi-Fi connection means reading captures for address rotation, DHCP churn and roaming events, rather than trusting a single snapshot.
    aliases: [wifi troubleshooting, DHCP, packet capture]
    maps:
      manimkc: [networking/wifi-drop-diagnosis]
      courses: []
      concepts: []

  # ---------------- devtools ----------------
  - slug: manimgl-rendering-pipeline
