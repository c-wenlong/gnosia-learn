  # ---------------- foundations ----------------
  - slug: vector-and-linear-algebra-basics
    title: Vectors and the dot product
    domain: foundations
    summary: A vector is an element of a vector space rather than its coordinates, and the dot product of two vectors measures how aligned they are.
