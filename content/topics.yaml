    aliases: [npm, cargo, homebrew, apt, conda, dependency pinning]
    maps:
      manimkc: [devtools/package-registries]
      courses: []
      concepts: []

  # ---------------- databases ----------------
  - slug: orm-and-migrations
    title: ORMs and schema migrations
    domain: databases
    summary: SQLAlchemy's Core and ORM layers sit over a DBAPI driver, and Alembic manages the schema migrations that keep an evolving model in sync with the database.
    aliases: [SQLAlchemy, Alembic, DBAPI, unit of work]
    maps:
      manimkc: [databases/sqlalchemy-alembic]
      courses: []
      concepts: []

  # ---------------- data-structures ----------------
  - slug: merkle-trees-and-hash-trees
    title: Merkle trees and hash trees
    domain: data-structures
    summary: Hashing hashes up a tree gives a fast way to prove membership and to diff two large trees, which is why Git, Nix and Cursor all lean on it.
    aliases: [hash tree, inclusion proof, content addressing]
    maps:
      manimkc: [data-structures/merkle-trees]
      courses: []
      concepts: []

  # ---------------- computer-vision ----------------
  - slug: convolution-and-kernels
    title: Convolution and kernels
    domain: computer-vision
    summary: A convolution kernel slides over an image, multiplying and summing a local window at every position, and that one mechanic underlies CNN feature maps.
    aliases: [CNN kernels, stride and padding, filters]
    maps:
      manimkc: [computer-vision/convolution/kernel-mechanics]
      courses: []
      concepts: []

  # ---------------- big-data ----------------
  - slug: mapreduce-programming-model
    title: The MapReduce programming model
    domain: big-data
    summary: MapReduce splits a big computation into an independent map phase and a grouped reduce phase, which is how Hadoop Streaming turns a keyword-count problem into a pipeline.
    aliases: [Hadoop, Hadoop Streaming, map and reduce]
    maps:
      manimkc: [big-data/mapreduce-keyword-analysis]
      courses: []
      concepts: []

  # ---------------- cortex ----------------
  - slug: toolbox-permissions-model
    title: Toolbox permissions and roles
    domain: cortex
    summary: A role-and-scope model decides who can use which tool, with permissions inherited down a directory of named accounts.
