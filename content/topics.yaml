      concepts: []

  - slug: nix-package-management
    title: Nix, the language, store and system
    domain: devtools
    summary: Nix is a language, a content-addressed store, and a system (nixpkgs, flakes, nix-darwin, home-manager) for reproducibly building and configuring software.
