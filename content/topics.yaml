    maps:
      manimkc: []
      courses: []
      concepts: [vector-as-a-list-of-numbers, dot-product]

  # ---------------- machine-learning ----------------
  - slug: transformer-architecture-and-training
    title: Transformer architecture and training stages
    domain: machine-learning
    summary: A transformer block projects tokens into query, key and value roles, attends over them with softmax-weighted scores, and stacks with positional encoding; training runs through pretraining, fine-tuning and RLHF.
    aliases: [self-attention, multi-head attention, positional encoding, RLHF, pretraining]
    maps:
      manimkc: []
      courses: [cp4284-m1, cp4283-m6]
      concepts: [attention-weights, multi-head-attention, positional-encoding, query-key-value-projections, self-attention, softmax, transformer-block]

  - slug: autoregressive-generative-models
    title: Autoregressive generative models
    domain: machine-learning
    summary: Factoring a joint distribution as a chain of conditionals turns generation into next-item prediction, from PixelRNN/CNN to language models.
    aliases: [PixelCNN, next-token prediction, chain rule factorization]
    maps:
      manimkc: []
      courses: [cp4283-m1]
      concepts: []

  - slug: variational-autoencoders
    title: Variational autoencoders
    domain: machine-learning
    summary: A VAE learns a latent variable model by maximising an evidence lower bound, using the reparameterisation trick to keep gradients flowing through a sampled latent.
    aliases: [VAE, ELBO, reparameterization trick, posterior collapse]
    maps:
      manimkc: []
      courses: [cp4283-m2]
      concepts: []

  - slug: generative-adversarial-networks
    title: Generative adversarial networks
    domain: machine-learning
    summary: A generator and a discriminator train against each other in a minimax game, which is powerful but prone to mode collapse and instability.
    aliases: [GAN, minimax game, mode collapse]
    maps:
      manimkc: []
      courses: [cp4283-m3]
      concepts: []

  - slug: normalizing-flows
    title: Normalizing flows
    domain: machine-learning
    summary: A stack of invertible transformations gives exact likelihoods via the change-of-variables formula, at the cost of architectural constraints GANs and VAEs don't have.
    aliases: [invertible networks, change of variables, coupling layers]
    maps:
      manimkc: []
      courses: [cp4283-m4]
      concepts: []

  - slug: diffusion-models
    title: Diffusion models
    domain: machine-learning
    summary: A diffusion model learns to reverse a gradual noising process, which turns out to share its objective with score-based generative modelling.
    aliases: [DDPM, denoising, score-based models]
    maps:
      manimkc: []
      courses: [cp4283-m5]
      concepts: []

  - slug: distributed-training-and-inference-serving
    title: Distributed training and inference serving
    domain: machine-learning
